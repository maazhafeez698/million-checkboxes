<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OMCB — One Million Checkboxes</title>

    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <div class="eyebrow">
            <span class="brand-mark">OMCB</span>
            <span>SHARED DIGITAL CANVAS</span>
          </div>

          <h1>One Million<br />Checkboxes</h1>

          <p class="subtitle">Paint a pixel. Everyone sees it.</p>
        </div>

        <div id="connection-status" class="status">
          <span class="status-dot"></span>
          <span class="status-text">Connecting...</span>
        </div>
      </header>

      <section class="stats">
        <div class="stat stat-primary">
          <span class="stat-label">Checked</span>
          <strong id="checked-count">0</strong>
          <small>global</small>
        </div>

        <div class="stat">
          <span class="stat-label">Unchecked</span>
          <strong id="unchecked-count">1,000,000</strong>
          <small>remaining</small>
        </div>

        <div class="stat">
          <span class="stat-label">Your Activity</span>
          <strong id="user-changes">0</strong>
          <small>this session</small>
        </div>
      </section>

      <section class="canvas-section">
        <div class="canvas-header">
          <div>
            <span class="canvas-label">LIVE CANVAS</span>
            <span class="canvas-hint">Click a box to paint it</span>
          </div>

          <span class="canvas-size">1,000,000 pixels</span>
        </div>

        <div class="grid-wrapper">
          <div id="checkbox-grid"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
